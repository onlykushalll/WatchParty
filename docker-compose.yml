# WatchParty — Docker Compose (full stack)
# Run everything with: docker compose up -d

services:
  # Next.js web app (port 3000)
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CORS_ORIGIN=*
      - PUBLIC_URL=http://localhost:3000
      - DATABASE_URL=file:./db/watchparty.db
      - NEXT_PUBLIC_SYNC_SERVICE_URL=http://localhost:3003
      - NEXT_PUBLIC_VM_SERVICE_URL=ws://localhost:3004
      - NODE_ENV=production
    volumes:
      - app_db:/app/db
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/\", (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      sync:
        condition: service_healthy
      vm:
        condition: service_healthy

  # Socket.IO sync service (port 3003)
  sync:
    build: ./mini-services/sync-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - CORS_ORIGIN=*
      - PUBLIC_URL=http://localhost:3000
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3003/\").then(() => process.exit(0)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Virtual browser service (port 3004)
  vm:
    build: ./vm-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - CORS_ORIGIN=*
      - PUBLIC_URL=http://localhost:3000
      - CHROME_PATH=/usr/bin/chromium
      - HEADLESS=true
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3004/health\", (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  app_db:
