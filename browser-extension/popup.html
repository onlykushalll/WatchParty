<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 320px; font-family: -apple-system, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 16px; }
  h2 { color: #7c3aed; font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  input { width: 100%; padding: 8px 12px; border: 1px solid #333; border-radius: 6px; background: #181818; color: #e0e0e0; font-size: 13px; margin-bottom: 8px; outline: none; }
  input:focus { border-color: #7c3aed; }
  button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #7c3aed; color: white; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
  button:hover { background: #6d28d9; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  .status { padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; text-align: center; }
  .status.connected { background: rgba(16,185,129,0.15); color: #10b981; }
  .status.disconnected { background: rgba(115,115,115,0.15); color: #737373; }
  .info { font-size: 11px; color: #555; margin-top: 8px; line-height: 1.5; }
  a { color: #7c3aed; text-decoration: none; }
</style>
</head>
<body>
  <h2>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#7c3aed"><path d="M8 5v14l11-7z"/></svg>
    WatchParty Sync
  </h2>

  <div id="status" class="status disconnected">Not connected</div>

  <input id="room" placeholder="Room code (e.g. crimson-lair-493)" />
  <input id="name" placeholder="Your name" />

  <button id="connect">Connect & Sync</button>
  <button id="disconnect" class="danger" style="display:none">Disconnect</button>

  <div class="info">
    <strong>How to use:</strong><br>
    1. Create a room at <a href="https://wp.kushalneedsmcp.online" target="_blank">wp.kushalneedsmcp.online</a><br>
    2. Open any movie/video site (cinevo.nl, YouTube, etc.)<br>
    3. Enter your room code above + click Connect<br>
    4. Play the video — it syncs automatically!<br><br>
    <strong>Sync:</strong> <100ms latency, play/pause/seek all synced.
  </div>

  <script src="popup.js"></script>
</body>
</html>
